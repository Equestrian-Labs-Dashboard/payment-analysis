name: Generate Payment Methods Report

on:
  workflow_dispatch: {}
  schedule:
    # Every Monday 08:00 UTC — adjust to taste.
    - cron: "0 8 * * 1"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Generate report
        env:
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          SHOPIFY_CORRO_STORE: ${{ secrets.SHOPIFY_CORRO_STORE }}
          SHOPIFY_CORRO_TOKEN: ${{ secrets.SHOPIFY_CORRO_TOKEN }}
          SHOPIFY_CAVALI_STORE: ${{ secrets.SHOPIFY_CAVALI_STORE }}
          SHOPIFY_CAVALI_TOKEN: ${{ secrets.SHOPIFY_CAVALI_TOKEN }}
        run: npm run report

      - name: Upload workbook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shopify_Payment_Methods_Analysis
          path: output/Shopify_Payment_Methods_Analysis.xlsx

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/report-summary.json
          git diff --quiet --cached || git commit -m "chore: refresh payment methods report data"
          git push
