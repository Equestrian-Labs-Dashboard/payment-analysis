name: Generate Payment Methods Report

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate report
        env:
          SHOPIFY_API_VERSION: 2025-10
          SHOPIFY_CORRO_STORE: ${{ secrets.SHOPIFY_CORRO_STORE }}
          SHOPIFY_CORRO_TOKEN: ${{ secrets.SHOPIFY_CORRO_TOKEN }}
          SHOPIFY_CAVALI_STORE: ${{ secrets.SHOPIFY_CAVALI_STORE }}
          SHOPIFY_CAVALI_TOKEN: ${{ secrets.SHOPIFY_CAVALI_TOKEN }}
        run: npm run report

      - name: Upload workbook
        uses: actions/upload-artifact@v4
        with:
          name: Shopify_Payment_Methods_Analysis
          path: output/Shopify_Payment_Methods_Analysis.xlsx

      - name: Commit dashboard JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git diff --cached --quiet || git commit -m "chore: refresh payment dashboard data"
          git push
